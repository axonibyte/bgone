[package]
name = "bgone"
version = "0.6.1"
edition = "2021"
# Set by what the lockfile already requires (clap 4.6, hashbrown 0.17), so a
# too-old toolchain fails with a clear message instead of a resolver error.
rust-version = "1.85"
license = "BSD-2-Clause"
description = "Fast reactive TUI tree configuration tool for FreeBSD ports"

[dependencies]
# Interface
ratatui = "0.26"
crossterm = "0.27"

# Memo cache; parallel evaluation runs on rayon plus one plain worker thread
rusqlite = { version = "0.31", features = ["bundled"] }
rayon = "1.10"

# CLI parsing & config
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
