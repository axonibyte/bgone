[package]
name = "bgone"
version = "0.4.0"
edition = "2021"
license = "BSD-2-Clause"
description = "Fast reactive TUI tree configuration tool for FreeBSD ports"

[dependencies]
# UI Framework
ratatui = "0.26"
crossterm = "0.27"
regex = "1.10"

# Graph Data Structure
petgraph = "0.6"

# Database & Async Runtime
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1.38", features = ["full"] }
rayon = "1.10"

# CLI Parsing & Utilities
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
