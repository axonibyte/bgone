image: rust:latest

options:
  docker: true

definitions:
  caches:
    cargo:
      key:
        files:
          - Cargo.lock
      path: .cargo_cache

  yaml-anchors:
    # Shared build logic, parameterized by $TARGET (exported by each parallel step).
    - &buildScript |
      export CARGO_HOME="$BITBUCKET_CLONE_DIR/.cargo_cache"
      VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
      curl -sL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-musl.tar.gz | tar xz -C /usr/local/bin
      mkdir -p dist
      echo "=========================================="
      echo "Building target $TARGET (offline mode)"
      echo "=========================================="
      cross build --target "$TARGET" --offline --release || cross build --target "$TARGET" --release
      if [[ "$TARGET" == *"windows"* ]]; then
        cp "target/$TARGET/release/bgone.exe" "dist/bgone-v${VERSION}-${TARGET}.exe"
      else
        cp "target/$TARGET/release/bgone" "dist/bgone-v${VERSION}-${TARGET}"
      fi

  steps:
    - step: &doMirror
        name: Mirror repository
        clone:
          enabled: false
        script:
          - git clone --mirror git@bitbucket.org:${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}.git
          - cd ${BITBUCKET_REPO_SLUG}.git
          - git push --mirror git@github.com:${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}.git

    - step: &doFetchAndTest
        name: Fetch dependencies and run tests
        caches:
          - cargo
        script:
          - export CARGO_HOME="$BITBUCKET_CLONE_DIR/.cargo_cache"
          - cargo fetch
          - cargo test --release
        artifacts:
          - .cargo_cache/**

    - step: &doParallelBuild
        # name and script are overridden per-target below
        name: Build (cross)
        services:
          - docker
        artifacts:
          - dist/*

    - step: &doDeploy
        name: Deploy multi-target artifacts
        clone:
          enabled: false
        script:
          - |
            for f in dist/*; do
              if [[ -f "$f" && "$f" != *.sha256 ]]; then
                echo "Uploading $f..."
                sha256sum "$f" | awk '{ print $1 }' > "${f}.sha256"
                curl -sf -u "${BB_PUB_USER}:${BB_PUB_SECRET}" \
                  -X POST "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}/downloads" \
                  --form files=@"${f}" --form files=@"${f}.sha256"
              fi
            done

pipelines:
  branches:
    main:
      - step: *doMirror
      - step: *doFetchAndTest
      - parallel:
          steps:
            - step:
                <<: *doParallelBuild
                name: Build x86_64-unknown-linux-gnu
                script:
                  - export TARGET=x86_64-unknown-linux-gnu
                  - *buildScript
            - step:
                <<: *doParallelBuild
                name: Build aarch64-unknown-linux-gnu
                script:
                  - export TARGET=aarch64-unknown-linux-gnu
                  - *buildScript
            - step:
                <<: *doParallelBuild
                name: Build x86_64-pc-windows-gnu
                script:
                  - export TARGET=x86_64-pc-windows-gnu
                  - *buildScript
            - step:
                <<: *doParallelBuild
                name: Build x86_64-unknown-freebsd
                script:
                  - export TARGET=x86_64-unknown-freebsd
                  - *buildScript
            - step:
                <<: *doParallelBuild
                name: Build aarch64-unknown-freebsd
                script:
                  - export TARGET=aarch64-unknown-freebsd
                  - *buildScript
      - step: *doDeploy

    dev:
      - step: *doMirror
      - step: *doFetchAndTest

    '**':
      - step: *doMirror