image: rust:latest

definitions:
  caches:
    cargo:
      key:
        files:
          - Cargo.lock
      path: .cargo_cache

  steps:
    - step: &doMirror
        name: Mirror repository
        clone:
          enabled: false
        script:
          - git clone --mirror git@bitbucket.org:${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}.git
          - cd ${BITBUCKET_REPO_SLUG}.git
          - git push --mirror git@github.com:${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}.git

    - step: &doFetchAndTest
        name: Fetch dependencies and run tests
        caches:
          - cargo
        script:
          - export CARGO_HOME="$BITBUCKET_CLONE_DIR/.cargo_cache"
          - cargo fetch --locked
          - cargo test --release --locked

    # All per-target build logic lives in ci/build-target.sh. No docker:
    # Bitbucket's daemon forbids volume mounts outside $BITBUCKET_CLONE_DIR,
    # which breaks `cross`, so FreeBSD targets are linked with zig instead.
    - step: &doBuild
        name: Build (see ci/build-target.sh)
        caches:
          - cargo
        artifacts:
          - dist/*

    - step: &doDeploy
        name: Deploy multi-target artifacts
        clone:
          enabled: false
        script:
          - |
            for f in dist/*; do
              if [[ -f "$f" && "$f" != *.sha256 ]]; then
                echo "Uploading $f..."
                sha256sum "$f" | awk '{ print $1 }' > "${f}.sha256"
                curl -sS --fail-with-body \
                  -H "Authorization: Bearer ${BB_PUB_SECRET}" \
                  -X POST "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO_OWNER}/${BITBUCKET_REPO_SLUG}/downloads" \
                  --form files=@"${f}" --form files=@"${f}.sha256"
                echo "Uploaded $f + checksum"
              fi
            done

pipelines:
  branches:
    main:
      - step: *doMirror
      - step: *doFetchAndTest
      - parallel:
          steps:
            - step:
                <<: *doBuild
                name: Build x86_64-unknown-linux-gnu
                script:
                  - bash ci/build-target.sh x86_64-unknown-linux-gnu
            - step:
                <<: *doBuild
                name: Build aarch64-unknown-linux-gnu
                script:
                  - bash ci/build-target.sh aarch64-unknown-linux-gnu
            - step:
                <<: *doBuild
                name: Build x86_64-pc-windows-gnu
                script:
                  - bash ci/build-target.sh x86_64-pc-windows-gnu
            - step:
                <<: *doBuild
                name: Build x86_64-unknown-freebsd
                script:
                  - bash ci/build-target.sh x86_64-unknown-freebsd
            - step:
                <<: *doBuild
                name: Build aarch64-unknown-freebsd
                script:
                  - bash ci/build-target.sh aarch64-unknown-freebsd
      - step: *doDeploy

    '{feature/**,bugfix/**,release/**,hotfix/**}':
      - step: *doMirror
      - step: *doFetchAndTest

    '**':
      - step: *doMirror
